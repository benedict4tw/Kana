<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kennst Du's? — Lösungen</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kana">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=chillax@700,600&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0d0d0d;
    --gruen: #2e8b4f;
    --gelb: #d9a916;
    --rot: #c0392b;
    --border: rgba(255,255,255,0.14);
    --text-muted: rgba(255,255,255,0.6);
    --ink: #1a1a1a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100%;
    background: var(--black);
    color: #FFFFFF;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow-x: hidden;
    touch-action: manipulation;
  }

  .sparkle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: sparkle ease-in-out infinite;
  }

  @keyframes floatLogo {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-10px) rotate(2deg); }
  }

  @keyframes popIn {
    0% { transform: scale(0.6); opacity: 0; }
    60% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }

  @keyframes sparkle {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-8px); }
    40%, 60% { transform: translateX(8px); }
  }

  .install-banner {
    position: fixed;
    left: 16px;
    right: 16px;
    top: -260px;
    z-index: 50;
    max-width: 400px;
    margin: 0 auto;
    background: linear-gradient(160deg, rgba(21,154,82,0.25), rgba(13,13,13,0.96) 55%);
    backdrop-filter: blur(14px);
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 18px 18px 20px;
    box-shadow: 0 20px 50px -10px rgba(0,0,0,0.6);
    font-family: 'Baloo 2', system-ui, sans-serif;
    color: #fff;
    transition: top 0.5s cubic-bezier(0.34,1.2,0.4,1);
  }

  .install-banner.show {
    top: calc(env(safe-area-inset-top) + 16px);
  }

  .install-banner-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .install-banner-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    flex-shrink: 0;
    object-fit: contain;
    background: #0d0d0d;
    padding: 4px;
    animation: bannerIconPulse 2.2s ease-in-out infinite;
  }

  @keyframes bannerIconPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .install-banner-text {
    flex: 1;
  }

  .install-banner-text strong {
    display: block;
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 3px;
  }

  .install-banner-text span {
    display: block;
    font-size: 12.5px;
    color: rgba(255,255,255,0.65);
    font-family: 'Plus Jakarta Sans', sans-serif;
    line-height: 1.4;
  }

  .install-banner-close {
    background: none;
    border: none;
    color: rgba(255,255,255,0.45);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 4px;
    flex-shrink: 0;
  }

  .install-banner-steps {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    font-size: 13px;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }

  .install-banner-share-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    animation: bannerBounce 1.6s ease-in-out infinite;
  }

  @keyframes bannerBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  .install-btn {
    margin-top: 14px;
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-family: 'Baloo 2', system-ui, sans-serif;
    font-weight: 800;
    font-size: 14px;
    color: #fff;
    background: linear-gradient(180deg, #1cad5e, #159a52);
    box-shadow: 0 4px 0 #0e6d3a;
    cursor: pointer;
    transition: transform 0.08s ease;
  }

  .install-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #0e6d3a;
  }

  .wrap {
    width: 100%;
    min-height: 100vh;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Baloo 2', system-ui, sans-serif;
    background:
      radial-gradient(circle at 20% 12%, rgba(21,154,82,0.35) 0%, rgba(21,154,82,0) 38%),
      radial-gradient(circle at 85% 18%, rgba(239,168,46,0.28) 0%, rgba(239,168,46,0) 40%),
      radial-gradient(circle at 55% 48%, rgba(210,60,46,0.22) 0%, rgba(210,60,46,0) 45%),
      #0d0d0d;
  }

  .content {
    width: 100%;
    max-width: 430px;
    padding: calc(56px + env(safe-area-inset-top)) 24px calc(40px + env(safe-area-inset-bottom));
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  @media (min-width: 768px) {
    .content {
      max-width: 640px;
      padding: 64px 40px;
    }
    .logo { width: 130px; height: 158px; }
    .wordmark { font-size: 40px; }
    h1 { font-size: 32px; }
    .subtitle { font-size: 18px; }
    #kana-card-lookup { font-size: 26px; padding: 24px 26px; }
    .scan-btn { width: 68px; height: 68px; }
    .card-frage { font-size: 22px; }
    .option-btn { font-size: 17px; padding: 16px 18px; }
    .reveal-btn { font-size: 17px; padding: 16px 18px; }
    .ziehen-badge { font-size: 26px; }
    .typ-pill { font-size: 14px; }
  }

  @media (min-width: 1100px) {
    .content {
      max-width: 760px;
      padding: 72px 56px;
    }
    .wordmark { font-size: 46px; }
    h1 { font-size: 36px; }
    .subtitle { font-size: 20px; }
  }

  .logo {
    width: 107px;
    height: 130px;
    object-fit: contain;
    margin-bottom: 8px;
    filter: drop-shadow(0 12px 20px rgba(0,0,0,0.5));
    animation: floatLogo 4.5s ease-in-out infinite;
  }

  .wordmark {
    font-family: 'Chillax', sans-serif;
    font-weight: 700;
    font-size: 42px;
    letter-spacing: 0.5px;
    margin-bottom: 28px;
    animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.1s both;
  }

  h1 {
    font-family: 'Baloo 2', system-ui, sans-serif;
    font-size: 24px;
    font-weight: 800;
    text-align: center;
    line-height: 1.25;
    margin-bottom: 10px;
    animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.2s both;
  }

  .subtitle {
    color: rgba(255,255,255,0.5);
    font-size: 15px;
    text-align: center;
    margin-bottom: 32px;
    animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.3s both;
  }

  .input-wrap {
    width: 100%;
    display: flex;
    gap: 8px;
    margin-bottom: 0;
    min-width: 0;
    animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.4s both;
  }

  #kana-card-lookup.invalid {
    border-color: #d23c2e !important;
    animation: shake 0.5s ease;
  }

  #kana-card-lookup {
    flex: 1;
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
    -webkit-appearance: none;
    appearance: none;
    padding: 20px 22px;
    border-radius: 20px;
    border: 2px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-family: 'Baloo 2', system-ui, sans-serif;
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    letter-spacing: 2px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  #kana-card-lookup::placeholder {
    color: rgba(255,255,255,0.35);
    font-size: 18px;
    letter-spacing: 2px;
  }

  #kana-card-lookup:focus {
    border-color: rgba(255,255,255,0.35);
  }

  .scan-btn {
    flex-shrink: 0;
    width: 62px;
    border-radius: 20px;
    border: 2px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .scan-btn svg { width: 26px; height: 26px; }
  .scan-btn:hover { background: rgba(255,255,255,0.1); }
  .scan-btn:active { transform: scale(0.94); }

  .scan-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: #000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .scan-overlay.show { display: flex; }

  .scan-overlay-top {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 16px);
    left: 16px;
    z-index: 2;
  }

  .scan-cancel-btn {
    padding: 10px 18px;
    border-radius: 12px;
    border: none;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(8px);
    color: #fff;
    font-family: 'Baloo 2', system-ui, sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }

  #scanVideo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .scan-frame {
    position: relative;
    z-index: 1;
    width: min(58vw, 230px);
    aspect-ratio: 0.65;
    border: 3px solid #fff;
    border-radius: 20px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.55);
  }

  .scan-hint {
    position: relative;
    z-index: 1;
    margin-top: 18px;
    color: #fff;
    font-size: 14px;
    text-align: center;
    padding: 0 24px;
    max-width: 340px;
  }

  /* --- Card im Front-Print-Stil --- */
  .card {
    width: 100%;
    margin-top: 16px;
    background: #FDFDFC;
    color: var(--ink);
    border-radius: 22px;
    overflow: hidden;
    display: none;
    box-shadow: 0 20px 50px -12px rgba(0,0,0,0.5);
  }

  .card.show {
    display: block;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    position: relative;
    padding: 18px 22px 30px;
    color: #fff;
  }

  .card-header.gruen { background: var(--gruen); }
  .card-header.gelb { background: var(--gelb); }
  .card-header.rot { background: var(--rot); }

  .card-header::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 20px;
    background: #FDFDFC;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }

  .ziehen-badge {
    font-family: 'Chillax', sans-serif;
    font-weight: 700;
    font-size: 22px;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .ziehen-badge span {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.85;
  }

  .card-body {
    padding: 4px 24px 26px;
    text-align: center;
  }

  .typ-pill {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 16px;
    color: #fff;
  }

  .typ-pill.gruen { background: var(--gruen); }
  .typ-pill.gelb { background: var(--gelb); }
  .typ-pill.rot { background: var(--rot); }

  .card-frage {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 20px;
    text-align: center;
  }

  .nr-badge {
    display: flex;
    margin: 0 auto 22px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    color: #fff;
    font-family: 'Chillax', sans-serif;
    font-weight: 700;
    font-size: 13px;
    align-items: center;
    justify-content: center;
  }

  .nr-badge.gruen { background: var(--gruen); }
  .nr-badge.gelb { background: var(--gelb); }
  .nr-badge.rot { background: var(--rot); }

  .card-antwort {
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    text-align: center;
    padding-top: 16px;
    border-top: 1px solid rgba(0,0,0,0.1);
    border-radius: 12px;
    animation: answerGlow 1.6s ease-out;
  }

  @keyframes answerGlow {
    0% {
      background-color: rgba(46,139,79,0.35);
      box-shadow: 0 0 30px 6px rgba(46,139,79,0.55);
    }
    100% {
      background-color: rgba(46,139,79,0);
      box-shadow: 0 0 0 0 rgba(46,139,79,0);
    }
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-btn {
    text-align: left;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1.5px solid rgba(0,0,0,0.1);
    background: rgba(0,0,0,0.03);
    color: var(--ink);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    gap: 10px;
    transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
  }

  .option-btn:hover:not(:disabled) {
    background: rgba(0,0,0,0.06);
  }

  .option-btn:active:not(:disabled) {
    transform: scale(0.98);
  }

  .option-btn:disabled {
    cursor: default;
  }

  .option-letter {
    font-weight: 700;
    opacity: 0.45;
    flex-shrink: 0;
  }

  .option-btn.correct {
    background: rgba(46,139,79,0.12);
    border-color: var(--gruen);
  }

  .option-btn.wrong {
    background: rgba(192,57,43,0.12);
    border-color: var(--rot);
  }

  .feedback {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid rgba(0,0,0,0.1);
    display: none;
  }

  .feedback.show {
    display: block;
    animation: fadeIn 0.3s ease;
  }

  .feedback-result {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .feedback-result.richtig { color: var(--gruen); }
  .feedback-result.falsch { color: var(--rot); }

  .feedback-sub {
    font-size: 14px;
    color: rgba(0,0,0,0.6);
  }

  .not-found {
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    text-align: center;
    display: none;
  }

  .not-found.show { display: block; }

  .footer-link {
    margin-top: auto;
    padding-top: 32px;
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    text-align: center;
  }

  /* Reveal-Modus */
  .reveal-btn {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1.5px solid rgba(0,0,0,0.12);
    background: rgba(0,0,0,0.04);
    color: var(--ink);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .reveal-btn:hover {
    background: rgba(0,0,0,0.08);
  }

  .reveal-btn:active {
    transform: scale(0.98);
  }

  /* Dual-Modus */
  .dual-wrap {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-wrap: wrap;
    justify-content: center;
  }

  .dual-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .dual-field label {
    font-size: 12px;
    color: rgba(0,0,0,0.55);
  }

  .dual-input {
    width: 90px;
    padding: 12px;
    border-radius: 10px;
    border: 1.5px solid rgba(0,0,0,0.15);
    background: rgba(0,0,0,0.03);
    color: var(--ink);
    font-size: 15px;
    text-align: center;
    outline: none;
  }

  .dual-submit {
    padding: 12px 18px;
    border-radius: 10px;
    border: none;
    background: var(--ink);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s ease;
  }

  .dual-submit:active {
    transform: scale(0.97);
  }

  /* Barrierefreiheit & Bewegungspräferenz */
  #kana-card-lookup:focus-visible,
  .option-btn:focus-visible,
  .reveal-btn:focus-visible,
  .dual-submit:focus-visible,
  .dual-input:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .card.show { animation: none; }
    .feedback.show { animation: none; }
    .logo, .wordmark, h1, .subtitle, .input-wrap { animation: none; }
    .sparkle { animation: none; }
    .card-antwort { animation: none; }
  }
</style>
</head>
<body>

  <div class="bg"></div>

  <div class="install-banner" id="installBanner">
    <div class="install-banner-top">
      <img class="install-banner-icon" src="/icon-192.png" alt="Kana">
      <div class="install-banner-text">
        <strong>Kana zum Homescreen hinzufügen</strong>
        <span id="installBannerSub">Schnellerer Zugriff, funktioniert auch offline.</span>
      </div>
      <button class="install-banner-close" id="installBannerClose" aria-label="Schließen">✕</button>
    </div>
    <div class="install-banner-steps" id="installBannerSteps" style="display:none;">
      <svg class="install-banner-share-icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
        <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5 12v7a1 1 0 001 1h12a1 1 0 001-1v-7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Tippe auf <strong>Teilen</strong>, dann <strong>„Zum Home-Bildschirm"</strong></span>
    </div>
    <button class="install-btn" id="installBtn" style="display:none;">Jetzt installieren</button>
  </div>

  <div class="wrap">

  function normalize(str) {
    return str.toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]/g, '')
      .trim();
  }

  function feedbackBlock(correct, penaltyCount, extraText) {
    const div = document.createElement('div');
    div.className = 'feedback show';

    div.innerHTML = `
      <div class="feedback-result ${correct ? 'richtig' : 'falsch'}">${correct ? 'Richtig ✅' : 'Falsch ❌'}</div>
      <div class="feedback-sub">${correct ? 'Karte kann abgelegt werden.' : ('Lege die Karte in den Ziehstapel und zieh ' + n + ' Karte' + (n > 1 ? 'n' : '') + '. ' + (extraText || ''))}</div>
    `;
    return div;
  }

  function renderMC(found) {

      btn.innerHTML = (opt.letter ? '<span class="option-letter">' + opt.letter + '</span>' : '') + '<span>' + opt.text + '</span>';
      btn.addEventListener('click', () => {
        const allBtns = optWrap.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        const isMC1 = found.modus === 'mc';

        btn.classList.add(isCorrect ? 'correct' : 'wrong');

        if (isCorrect) {
          modeContainer.appendChild(feedbackBlock(true, penalty[found.farbe], ''));

          allBtns.forEach(b => {

  function resetCard() {

  function doLookup() {
    const raw = numberInput.value.replace(/[^0-9]/g, '').trim();
    if (raw !== numberInput.value) numberInput.value = raw;
    resetCard();
    numberInput.classList.remove('invalid');
    if (!raw) return;
    const padded = raw.padStart(3, '0');
    const found = questions.find(q => q.nr === padded || q.nr === raw);

    if (!found) {
      if (raw.length >= 1) notFound.classList.add('show');
      if (raw.length === 3) {
        numberInput.classList.add('invalid');
        setTimeout(() => numberInput.classList.remove('invalid'), 500);
      }
      return;
    }

    cardHeader.classList.add(found.farbe);
    ziehenBadge.innerHTML = penalty[found.farbe] + '<span>Ziehen</span>';
    typPill.classList.add(found.farbe);
    typPill.textContent = found.typ;
    resultFrage.textContent = found.frage;
    nrBadge.classList.add(found.farbe);
    nrBadge.textContent = String(parseInt(found.nr, 10));

    if (found.modus === 'mc' || found.modus === 'mc2') renderMC(found);
    else if (found.modus === 'dual') renderDual(found);
    else renderReveal(found);

    resultCard.classList.add('show');

  function tesseractReady() {
    if (window.Tesseract) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      script.onload = resolve;
      script.onerror = () => reject(new Error('Tesseract konnte nicht geladen werden'));
      document.head.appendChild(script);
    });
  }

  function stopScan() {
    if (scanTickTimer) { clearInterval(scanTickTimer); scanTickTimer = null; }
    if (scanTimeoutTimer) { clearTimeout(scanTimeoutTimer); scanTimeoutTimer = null; }
    if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
    scanVideo.srcObject = null;
    scanOverlay.classList.remove('show');
    if (scanHint) scanHint.textContent = scanHintDefault;
    if (scanWorker) {
      const w = scanWorker;
      scanWorker = null;
      w.terminate().catch(() => {});
    }
  }

  function preprocessForOcr(canvas) {
    const ctx = canvas.getContext('2d');
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    const threshold = 160;
    for (let i = 0; i < data.length; i += 4) {
      const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      // Binarisierung ohne Invertierung: dunkler Fragetext bleibt schwarz,
      // heller Kartenhintergrund wird weiß
      const v = lum < threshold ? 0 : 255;
      data[i] = data[i + 1] = data[i + 2] = v;
    }
    ctx.putImageData(imageData, 0, 0);
    return canvas;
  }

  function normalizeForMatch(str) {
    return (str || '')
      .toLowerCase()
      .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
      .replace(/[^a-z0-9\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // Seltene Wörter (Eigennamen) sollen stärker zählen als Füllwörter, da sich
  // viele Fragen im JSON nur durch Namen unterscheiden ("Beziehung zwischen X und Y?").
  // Sonst ist reines Wort-Overlap zwischen unterschiedlichen Karten zu mehrdeutig.
  const questionIdf = (function buildIdf() {
    const df = {};
    questions.forEach(q => {
      const tokens = new Set(normalizeForMatch(q.frage).split(' ').filter(Boolean));
      tokens.forEach(t => { df[t] = (df[t] || 0) + 1; });
    });
    const n = questions.length;
    const idf = {};
    Object.keys(df).forEach(t => { idf[t] = Math.log((n + 1) / (df[t] + 1)) + 1; });
    return idf;
  })();

  function tokenSimilarity(a, b) {
    const tokensA = new Set(a.split(' ').filter(Boolean));
    const tokensB = new Set(b.split(' ').filter(Boolean));
    if (!tokensA.size || !tokensB.size) return 0;
    let commonWeight = 0, weightA = 0, weightB = 0;
    tokensA.forEach(t => {
      const w = questionIdf[t] || 1;
      weightA += w;
      if (tokensB.has(t)) commonWeight += w;
    });
    tokensB.forEach(t => { weightB += (questionIdf[t] || 1); });
    return (2 * commonWeight) / (weightA + weightB);
  }

  function matchQuestionToCard(ocrText) {
    const normOcr = normalizeForMatch(ocrText);
    if (!normOcr) return null;
    const MATCH_THRESHOLD = 0.6;
    let best = null;
    let bestScore = 0;
    questions.forEach(q => {
      const score = tokenSimilarity(normOcr, normalizeForMatch(q.frage));
      if (score > bestScore) { bestScore = score; best = q; }
    });
    return bestScore >= MATCH_THRESHOLD ? best : null;
  }

  async function recognizeTick() {
    const worker = scanWorker;
    if (scanBusy || !worker || !scanVideo.videoWidth) return;
    scanBusy = true;
    try {
      const frameRect = scanFrame.getBoundingClientRect();
      const videoRect = scanVideo.getBoundingClientRect();
      const scaleX = scanVideo.videoWidth / videoRect.width;
      const scaleY = scanVideo.videoHeight / videoRect.height;

      // Mittlerer Kartenbereich erfassen: dort steht der Fragetext,
      // zwischen der Kategorie-Pill oben und dem Nummern-Badge unten
      const roiLeft = frameRect.left;
      const roiTop = frameRect.top + frameRect.height * 0.25;
      const roiWidth = frameRect.width;
      const roiHeight = frameRect.height * 0.40;

      const cropX = Math.max(0, (roiLeft - videoRect.left) * scaleX);
      const cropY = Math.max(0, (roiTop - videoRect.top) * scaleY);
      const cropW = roiWidth * scaleX;
      const cropH = roiHeight * scaleY;

      const canvas = document.createElement('canvas');
      canvas.width = cropW;
      canvas.height = cropH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(scanVideo, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
      preprocessForOcr(canvas);

      const { data } = await worker.recognize(canvas);
      const found = matchQuestionToCard(data.text);

      if (found) {
        stopScan();
        numberInput.value = String(parseInt(found.nr, 10));
        doLookup();
        return;
      }
    } catch (err) {
      // Erkennung fehlgeschlagen, beim nächsten Tick erneut versuchen
    } finally {
      scanBusy = false;
    }
  }

  async function startScan() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

    try {
      await tesseractReady();
    } catch (err) {
      return;
    }

    try {
      scanStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' },
        audio: false
      });
    } catch (err) {
      return;
    }

    scanVideo.srcObject = scanStream;
    scanOverlay.classList.add('show');
    try { await scanVideo.play(); } catch (err) {}

    scanWorker = await window.Tesseract.createWorker('deu');
    await scanWorker.setParameters({
      tessedit_pageseg_mode: '6'
    });

    scanTickTimer = setInterval(recognizeTick, 1100);
    scanTimeoutTimer = setTimeout(() => {
      if (scanHint) scanHint.textContent = 'Nummer nicht erkannt, bitte manuell eingeben';
      setTimeout(stopScan, 1400);
    }, 9000);
  }

  if (scanBtn) scanBtn.addEventListener('click', startScan);
  if (scanCancelBtn) scanCancelBtn.addEventListener('click', stopScan);

  // Sparkle-Partikel generieren
  const sparkleColors = ['#159a52', '#d23c2e', '#efa82e'];
  const sparkleContainer = document.getElementById('sparkleContainer');
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    const size = Math.round(Math.random() * 3 + 2);
    s.style.left = Math.round(Math.random() * 90 + 5) + '%';
    s.style.top = Math.round(Math.random() * 90 + 2) + '%';
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.background = sparkleColors[i % sparkleColors.length];
    s.style.animationDuration = (Math.random() * 2 + 1.5).toFixed(1) + 's';
    s.style.animationDelay = (Math.random() * 3).toFixed(1) + 's';
    sparkleContainer.appendChild(s);
  }

  // Service Worker registrieren
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }

  // --- Install-Banner ---
  (function() {
    const banner = document.getElementById('installBanner');
    const closeBtn = document.getElementById('installBannerClose');
    const stepsEl = document.getElementById('installBannerSteps');
    const installBtn = document.getElementById('installBtn');
    const subEl = document.getElementById('installBannerSub');

    const isStandalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    const dismissed = localStorage.getItem('kana-install-dismissed') === 'true';
    const isIOS = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());

    let deferredPrompt = null;

    function showBanner() {
      setTimeout(() => banner.classList.add('show'), 900);
    }

    function hideBanner() {
      banner.classList.remove('show');
    }

    closeBtn.addEventListener('click', () => {
      localStorage.setItem('kana-install-dismissed', 'true');
      hideBanner();
    });

    if (!isStandalone && !dismissed) {
      if (isIOS) {
        subEl.textContent = 'Installier die App für schnellen Zugriff, auch offline.';
        stepsEl.style.display = 'flex';
        showBanner();
      } else {
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          deferredPrompt = e;
          installBtn.style.display = 'block';
          showBanner();
        });
      }
    }

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      hideBanner();
      if (outcome === 'accepted') {
        localStorage.setItem('kana-install-dismissed', 'true');
      }
    });

    window.addEventListener('appinstalled', () => {
      localStorage.setItem('kana-install-dismissed', 'true');
      hideBanner();
    });
  })();
</script>

</body>
</html>
